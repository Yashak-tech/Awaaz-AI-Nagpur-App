
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="format-detection" content="telephone=no" />
      <title>Awaaz-AI - The Nagpur App</title>
      <style>
        /* Force mobile layout on all devices */
        html, body {
          max-width: 100%;
          overflow-x: hidden;
        }
        
        /* Desktop mobile simulation styles */
        @media (min-width: 768px) {
          body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 25%, #06b6d4 50%, #10b981 75%, #f59e0b 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
            position: relative;
            overflow: hidden;
          }
          
          /* Animated background particles */
          body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
              radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
              radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
              radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
            background-size: 50px 50px, 80px 80px, 120px 120px;
            animation: particleMove 20s linear infinite;
            pointer-events: none;
          }
          body::after {
            content: 'Awaaz-AI • The Nagpur App (NMC)';
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(45deg, #FF9933, #FFFFFF, #138808);
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: pulse 2s ease-in-out infinite alternate;
            z-index: 1000;
          }
          
          @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
          }
          
          @keyframes particleMove {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
          }
          
          @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
          }
          
          #root {
            max-width: 375px !important;
            width: 375px !important;
            min-height: calc(100vh - 40px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
            z-index: 10;
          }
          
          /* Mobile device frame simulation */
          #root::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            z-index: 9999;
            margin-top: 8px;
          }
        }
        
        /* Mobile devices (keep original styling) */
        @media (max-width: 767px) {
          #root {
            width: 100% !important;
            max-width: 100% !important;
          }
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
